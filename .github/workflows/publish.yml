name: Publish to npm

# Trigger nur per tag (v0.x.x) — verhindert versehentlichen publish bei
# jedem main-Commit. Manuell triggerbar via workflow_dispatch.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Provenance (SLSA Build Level 2) braucht id-token: write damit der
# Sigstore-Workflow eine OIDC-Identitaet aus GitHub Actions zieht und
# die Build-Attestation signiert. Ohne diese Permission scheitert
# `npm publish --provenance` mit "OIDC not available".
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ACHTUNG: KEIN registry-url hier! setup-node schreibt damit eine
      # .npmrc mit _authToken=${NODE_AUTH_TOKEN} und setzt die Variable
      # auf einen Platzhalter ("XXXXX-..."). npm sieht den konfigurierten
      # Token, schickt den Fake statt OIDC zu nutzen -> E404 beim PUT
      # (Run 26998741236, 2026-06-05). Ohne registry-url erkennt npm>=11.5
      # die GitHub-OIDC-Umgebung selbst (Trusted Publishing).
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Trusted Publishing (OIDC) braucht npm >= 11.5.1 — Node 22 bundelt
      # nur npm 10.x. Ohne dieses Upgrade faellt npm auf Token-Auth
      # zurueck und der Publish scheitert mit E404.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest && npm --version

      # npm ci statt npm install — verifiziert package-lock.json gegen
      # registry-Integrity-Hashes. --ignore-scripts blockt malicious
      # postinstall-Hooks aus transitive Deps (npm Supply-Chain-Best-
      # Practice 2026).
      - name: Install dependencies (locked + no scripts)
        run: npm ci --ignore-scripts

      # Audit-Signatures: prueft dass alle installierten Packages eine
      # gueltige Sigstore-Signatur haben. Schlaegt fehl wenn ein Package
      # ohne Provenance / mit gefaelschter Signature im Dep-Tree ist.
      # WARN-LEVEL: einige Deps haben noch keine Provenance, daher
      # continue-on-error. Sobald alle Deps Provenance haben, hochstufen.
      - name: Verify dependency signatures
        run: npm audit signatures
        continue-on-error: true

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # SBOM (Software Bill of Materials) — Vorlauf auf die CRA-SBOM-Pflicht
      # (EU Cyber Resilience Act, ab 2027-12-11 verpflichtend). CycloneDX-
      # Format, NUR Produktions-Deps (--omit=dev) — spiegelt exakt das, was
      # ein `npm i techlogia` beim Nutzer installiert (die Angriffsflaeche des
      # veroeffentlichten Pakets, nicht Test-/Build-Tooling). Rein additiv,
      # kein Gate: schlaegt der Schritt fehl, blockt er den Publish nicht.
      - name: Generate SBOM (CycloneDX, production deps)
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cdx.json
        continue-on-error: true

      # SBOM als Build-Artefakt aufbewahren (retention default 90 Tage) —
      # ueber actions/upload-artifact, damit KEINE contents:write-Permission
      # noetig ist (minimaler Token-Scope, s. permissions oben). Fuer eine
      # dauerhaft oeffentliche SBOM koennte man sie spaeter zusaetzlich ans
      # GitHub-Release haengen (braucht dann contents:write).
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn

      # Trusted Publishing (seit 2026-06-05): Auth laeuft via GitHub-OIDC
      # gegen den auf npmjs.com konfigurierten Trusted Publisher
      # (Org TechLogia-de, Repo techlogia-cli, Workflow publish.yml) —
      # KEIN NPM_TOKEN-Secret mehr. Hintergrund: npm hat Ende 2025 alle
      # Classic-Tokens revoked + Granular-Tokens auf 90 Tage begrenzt;
      # das abgelaufene Secret liess jeden Publish mit E404 scheitern.
      # Provenance (SLSA Build Level 2 + Sigstore) bleibt wie gehabt.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
