name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22"]
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      # Wie im publish-Workflow: locked-install ohne postinstall-Hooks.
      - name: Install (locked + no scripts)
        run: npm ci --ignore-scripts

      - name: Verify dependency signatures (informational)
        run: npm audit signatures
        continue-on-error: true

      - name: Typecheck
        run: npm run lint

      # vitest 4 (Dev-Dependency, schliesst GHSA-5xrq-8626-4rwp) braucht
      # Node >= 20 und laedt auf 18 gar nicht erst. Endnutzer betrifft das
      # nicht — die CLI selbst supportet weiter Node >= 18. Deshalb: volle
      # Suite auf 20/22, auf 18 stattdessen Runtime-Smoke des Builds unten.
      - name: Test
        if: matrix.node != '18'
        run: npm test

      - name: Build
        run: npm run build

      # Runtime-Smoke auf JEDER Matrix-Zelle: beweist dass das gebaute
      # Bundle auf dieser Node-Version startet und commander korrekt
      # wired ist — auf Node 18 ist das der einzige Test (s.o.).
      - name: Smoke-test built CLI
        run: node dist/index.js --version && node dist/index.js --help
